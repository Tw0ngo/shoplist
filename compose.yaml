# Shoplist: `docker compose up -d`, then open http://<this computer's IP>:8080
services:
  shoplist:
    build: .
    image: shoplist:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      REGISTRATION: open              # open: anyone can sign up; invite: only with an invite link (the first account always works)
    volumes:
      - shoplist-data:/data
      # - ./branding:/branding:ro     # optional: hero.png for the header, own icons

volumes:
  shoplist-data:
